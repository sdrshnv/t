name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.95.0
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
      - name: Check version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/release.py version --tag "$RELEASE_TAG"
      - run: cargo +"$RUST_VERSION" fmt --all -- --check
      - run: cargo +"$RUST_VERSION" clippy --locked --all-targets --all-features -- -D warnings
      - name: Check release tooling
        run: |
          sh -n scripts/install.sh
          sh -n scripts/smoke-test.sh
          bash -n scripts/publish-release.sh
          shellcheck scripts/install.sh scripts/smoke-test.sh scripts/publish-release.sh
          python3 -m unittest discover -s scripts/tests -v

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          linker_var="CARGO_TARGET_$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          echo "$linker_var=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo +"$RUST_VERSION" test --locked --all-features --target "$TARGET"
      - run: cargo +"$RUST_VERSION" build --locked --release --target "$TARGET"
      - name: Package and smoke-test binary
        run: |
          python3 scripts/release.py package --target "$TARGET" --output dist
          mkdir unpacked
          tar -xzf dist/*.tar.gz -C unpacked
          sh scripts/smoke-test.sh "$PWD/unpacked/t" "$(python3 scripts/release.py version)"
          python3 -m unittest discover -s scripts/tests -v
      - name: Verify Linux binary has no shared-library dependencies
        if: runner.os == 'Linux'
        run: |
          if readelf -d unpacked/t | grep '(NEEDED)'; then
            echo 'Linux release binary must be statically linked' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Assemble release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py version --tag "$RELEASE_TAG"
          python3 scripts/release.py assemble --output dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh
