[package]
name = "t"
version = "0.1.0"
edition = "2024"
description = "A small dependency-aware task CLI"
license = "MIT"

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5.41", features = ["derive"] }
clap_complete = "4.5.55"
rusqlite = { version = "0.37.0", features = ["bundled"] }
shell-words = "1.1.0"
tempfile = "3.20.0"
thiserror = "2.0.12"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
proptest = "1.7.0"

[profile.release]
lto = "thin"
strip = true
